# Drahtseilakt toolbox release builds: Windows (x86_64, arm64: portable .zip and installer), Linux (x86_64, aarch64:
# portable .tar.gz, .deb, .rpm), macOS (arm64, x86_64: portable .tar.gz, not signed), FreeBSD x86_64 (.tar.gz, a VM build,
# experimental: it may fail without stopping the rest), with SHA256SUMS. Real-ESRGAN is bundled where a pinned build
# exists (Linux x86_64, Windows x86_64, macOS), checked against third-party.txt; the other packages say in README.txt
# that it is missing. Every package holds the game's OFL fonts (fonts/, with licences), see scripts/ci-package.sh.
#
#   Triggers (never a branch push): Actions -> "Toolbox release" -> Run workflow (packages as run artifacts), or a
#   pushed tag like 1.2.3, which also makes a DRAFT GitHub Release (gh release create --draft) with every package and
#   SHA256SUMS; nothing is public until the owner publishes the draft.
#
#   The toolbox builds on the game's crates by path (../drahtseilakt), so the game's repository is checked out beside it.
#   Secret GAME_TOKEN: a fine-grained token with read-only Contents on eugene-vereshchagin/drahtseilakt (a private
#   repository; the workflow's own token cannot read another repository). The job fails early if it is missing.
#   Input game_ref (default main): the game's branch, tag or commit; resolved to one commit in the plan job, so every
#   job builds the same pair.
#
# Actions are pinned by full commit SHA, the Rust toolchain by its exact version (the game's release workflow's), crates
# by Cargo.lock (fetched once with --locked, then built --offline). Tests are not run here.

name: Toolbox release

on:
  workflow_dispatch:
    inputs:
      game_ref:
        description: "The game's branch, tag or commit to build against"
        type: string
        default: main
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: toolbox-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.99.1'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  GAME_REPO: eugene-vereshchagin/drahtseilakt

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.p.outputs.version }}
      game_sha: ${{ steps.p.outputs.game_sha }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ secrets.GAME_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GAME_REF: ${{ inputs.game_ref || 'main' }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The secret GAME_TOKEN is not set (a fine-grained token, read-only Contents on $GAME_REPO)."
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then version=$REF_NAME; else version="git-${SHA:0:7}"; fi
          game_sha=$(gh api "repos/$GAME_REPO/commits/$GAME_REF" --jq .sha)
          [[ "$game_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve $GAME_REF in $GAME_REPO"; exit 1; }
          echo "game $GAME_REF = $game_sha"
          { echo "version=$version"; echo "game_sha=$game_sha"; } >>"$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-22.04, os: linux, arch: x86_64}
          - {name: linux-aarch64, runner: ubuntu-22.04-arm, os: linux, arch: aarch64}
          - {name: windows-x86_64, runner: windows-2025, os: windows, arch: x86_64}
          - {name: windows-aarch64, runner: windows-11-arm, os: windows, arch: aarch64}
          - {name: macos-aarch64, runner: macos-15, os: macos, arch: aarch64}
          - {name: macos-x86_64, runner: macos-15-intel, os: macos, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # the files exactly as committed (Windows runners convert line ends by default)
      - name: no line-end conversion
        run: git config --global core.autocrlf false
      # the toolbox takes the game's crates by path ../drahtseilakt: both checked out side by side
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: drahtseilakt-toolbox
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GAME_REPO }}
          ref: ${{ needs.plan.outputs.game_sha }}
          token: ${{ secrets.GAME_TOKEN }}
          path: drahtseilakt
          persist-credentials: false
      - name: toolchain
        working-directory: drahtseilakt-toolbox
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version && cargo --version
      - name: system libraries (Linux, the window's xkb and wayland)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev
      - name: fetch crates (pinned by Cargo.lock)
        working-directory: drahtseilakt-toolbox
        run: cargo fetch --locked
      - name: build
        working-directory: drahtseilakt-toolbox
        env:
          VXMATH_FONT_DIR: ${{ github.workspace }}/drahtseilakt/assets/fonts
          DRAHTSEILAKT_RELEASE: '1'
        run: cargo build --release --locked --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.name }}
          path: drahtseilakt-toolbox/target/release/drahtseilakt-toolbox${{ matrix.os == 'windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  # FreeBSD: built inside a VM. Experimental: the platform stack (window, file chooser) is untested, so a failure here
  # does not stop the release; the archive is added when it succeeds.
  freebsd:
    needs: plan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: drahtseilakt-toolbox
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GAME_REPO }}
          ref: ${{ needs.plan.outputs.game_sha }}
          token: ${{ secrets.GAME_TOKEN }}
          path: drahtseilakt
          persist-credentials: false
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '14.3'
          usesh: true
          prepare: |
            pkg install -y bash curl pkgconf rust libxkbcommon wayland
          run: |
            set -eu
            export DRAHTSEILAKT_RELEASE=1 CARGO_INCREMENTAL=0
            W=$(pwd)
            export VXMATH_FONT_DIR="$W/drahtseilakt/assets/fonts"
            # the VM's own rust (pkg): the pinned toolchain is for the other targets
            rustc --version
            cd drahtseilakt-toolbox
            cargo fetch --locked && cargo build --release --locked --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-freebsd-x86_64
          path: drahtseilakt-toolbox/target/release/drahtseilakt-toolbox
          if-no-files-found: error
          retention-days: 7

  # Every package is made here, on one Linux runner (archiving only): tar, zip, dpkg-deb, rpmbuild, NSIS (makensis).
  package:
    needs: [plan, build, freebsd]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: drahtseilakt-toolbox
          persist-credentials: false
      # only the fonts are wanted from the game
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GAME_REPO }}
          ref: ${{ needs.plan.outputs.game_sha }}
          token: ${{ secrets.GAME_TOKEN }}
          path: drahtseilakt
          sparse-checkout: assets/fonts
          persist-credentials: false
      - name: packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm nsis zip unzip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: bins
      - name: package every binary
        working-directory: drahtseilakt-toolbox
        run: |
          set -euo pipefail
          for d in "$GITHUB_WORKSPACE"/bins/bin-*; do
            n=${d##*/bin-}            # linux-x86_64, windows-aarch64, ...
            os=${n%%-*} arch=${n#*-}
            bin=$(find "$d" -type f -name 'drahtseilakt-toolbox*' | head -n1)
            echo "== $n: $bin"
            scripts/ci-package.sh "$os" "$arch" "$bin" "$VERSION"
          done
          cd dist
          ls -l
          rm -f SHA256SUMS && sha256sum -- *.tar.gz *.zip *.deb *.rpm *.exe > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-packages
          path: |
            drahtseilakt-toolbox/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # A pushed tag: a DRAFT release with every package and SHA256SUMS. Never published automatically.
  release:
    needs: package
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolbox-packages
          path: dist
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum --check --strict SHA256SUMS
          gh release create "$TAG" --draft --verify-tag --title "Drahtseilakt toolbox $TAG" \
            --notes "Drahtseilakt toolbox $TAG: Windows installer and portable zip, Linux portable archive, .deb and .rpm, macOS and FreeBSD archives. Check the files against SHA256SUMS. macOS builds are not signed (README.txt in the archive says how to open them). FreeBSD is experimental. Real-ESRGAN is bundled on Linux x86_64, Windows x86_64 and macOS only; README.txt in each package says whether it is included." \
            -- *.tar.gz *.zip *.deb *.rpm *.exe SHA256SUMS
